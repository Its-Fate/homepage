<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Webpage</title>
    </head>
    <body>
        <div class="header" style="padding-bottom: 5rem;">
            <h1 class="montserrat-h1">Contact Information</h1>
        </div>

        <div class="info">
            <div id="email" style="padding-top: 4rem; padding-bottom: 2rem;">Email: akbari7fatemeh@gmail.com</div>
            <div id="linkedin" style="padding: 2rem 2rem;">LinkedIn: linkedin.com/in/akbari7fatemeh</div>
            <div id="github" style="padding-top: 2rem; padding-bottom: 8rem;">GitHub: github.com/Its-Fate</div>
        </div>

        <script>
            // Copy email
            document.getElementById('email').addEventListener('click', function() {
                navigator.clipboard.writeText('akbari7fatemeh@gmail.com').then(function() {
                    alert('Email copied!');
                })
            });

            // Copy LinkedIn
            document.getElementById('linkedin').addEventListener('click', function() {
                navigator.clipboard.writeText('linkedin.com/in/akbari7fatemeh').then(function() {
                    alert('LinkedIn account address copied!');
                })
            });

            // Copy GitHub
            document.getElementById('github').addEventListener('click', function() {
                navigator.clipboard.writeText('github.com/Its-Fate').then(function() {
                    alert('GitHub account address copied!');
                })
            });
        </script>
    </body>
</html>
